name: P4 hotspot profile

on:
  push:
    branches:
      - p4-validation
    paths:
      - '.github/workflows/p4-hotspot-profile.yml'
      - 'source/**'

permissions:
  contents: read

jobs:
  p4-profile:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          lfs: false

      - name: Fetch pinned 0.107.1 game references
        shell: pwsh
        run: |
          git lfs pull --include="game-body/data_sts2_windows_x86_64/sts2.dll,game-body/data_sts2_windows_x86_64/0Harmony.dll,game-body/data_sts2_windows_x86_64/GodotSharp.dll,game-body/data_sts2_windows_x86_64/Steamworks.NET.dll,game-body/data_sts2_windows_x86_64/System.IO.Hashing.dll,game-body/data_sts2_windows_x86_64/SmartFormat.dll,game-body/data_sts2_windows_x86_64/SmartFormat.ZString.dll,game-body/data_sts2_windows_x86_64/JetBrains.Annotations.dll,game-body/data_sts2_windows_x86_64/Sentry.dll" --exclude=""
          $dll = '.\game-body\data_sts2_windows_x86_64\sts2.dll'
          $actual = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'a1f9e653f1e28e4076558fee1e60d218619cb7e057b887c6417f62c62c6d7a52'
          if ($actual -ne $expected) { throw "Pinned sts2.dll hash mismatch." }

      - name: Fetch pinned RitsuLib compatibility package
        shell: pwsh
        run: |
          $uri = 'https://github.com/BAKAOLC/STS2-RitsuLib/releases/download/v0.6.2/STS2.RitsuLib.Compat.0.107.1.0.6.2.github.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'ritsulib.zip'
          Invoke-WebRequest -Uri $uri -OutFile $zip
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '8cb0bc276d3c64dde5ea5415e1738808dcbe71f0a0baf3ef51008ae6dde13517'
          if ($actual -ne $expected) { throw "RitsuLib package hash mismatch." }
          $out = Join-Path $env:RUNNER_TEMP 'ritsulib'
          Expand-Archive -LiteralPath $zip -DestinationPath $out -Force
          $props = Get-ChildItem -LiteralPath $out -Recurse -Filter 'RitsuLib.References.props' | Select-Object -First 1
          if ($null -eq $props) { throw 'RitsuLib.References.props not found.' }
          "RITSU_PROPS=$($props.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RITSU_ROOT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Release build
        shell: pwsh
        run: |
          $gameData = (Resolve-Path '.\game-body\data_sts2_windows_x86_64').Path
          dotnet build '.\source\CombatSolver.csproj' -c Release -p:CopyModOnBuild=false -p:Sts2DataDir="$gameData" -p:RitsuLibReferencesProps="$env:RITSU_PROPS" -p:RitsuLibReferenceTarget='0.107.1' -p:TreatWarningsAsErrors=true --nologo

      - name: Build E0 profiler
        shell: pwsh
        run: |
          $gameData = (Resolve-Path '.\game-body\data_sts2_windows_x86_64').Path
          dotnet build '.\source\tools\E0PinnedHarness\E0PinnedHarness.csproj' -c Release -p:Sts2DataDir="$gameData" -p:RitsuLibReferencesProps="$env:RITSU_PROPS" -p:RitsuWorkshopRoot="$env:RITSU_ROOT" -p:RitsuLibReferenceTarget='0.107.1' -p:TreatWarningsAsErrors=true --nologo

      - name: Profile fixed inputs
        shell: pwsh
        run: |
          $harness = '.\source\tools\E0PinnedHarness\bin\Release\net9.0\E0PinnedHarness.dll'
          foreach ($scenario in @('teammate', 'draw_energy')) {
            $workspace = Join-Path $env:RUNNER_TEMP "p4-$scenario"
            New-Item -ItemType Directory -Force -Path $workspace | Out-Null
            & dotnet $harness --scenario $scenario --out $workspace --p4-profile
            if ($LASTEXITCODE -ne 0) { throw "P4 profile failed for $scenario." }
            $path = Join-Path $workspace "e0-$scenario.json"
            $evidence = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            $timeTop = @($evidence.performance | Sort-Object elapsedMs -Descending | Select-Object -First 8 name,elapsedMs,allocatedBytes)
            $allocTop = @($evidence.performance | Sort-Object allocatedBytes -Descending | Select-Object -First 8 name,elapsedMs,allocatedBytes)
            "P4_PROFILE_SUMMARY scenario=$scenario hp=$($evidence.projectedBattleHpLost) potions=$($evidence.projectedBattlePotionCount) nodes=$($evidence.totalExpandedNodes) transitions=$($evidence.totalTransitionCount) published_ms=$($evidence.publishedMs)"
            "P4_PROFILE_TIME scenario=$scenario data=$($timeTop | ConvertTo-Json -Compress)"
            "P4_PROFILE_ALLOC scenario=$scenario data=$($allocTop | ConvertTo-Json -Compress)"
          }

      - name: P4 history counter contracts
        shell: pwsh
        run: |
          dotnet run --project '.\source\tools\HistoryCounterKeyChecks\HistoryCounterKeyChecks.csproj' -c Release --nologo

      - name: P4 calculated-history fresh-process A/B
        shell: pwsh
        run: |
          $harness = '.\source\tools\E0PinnedHarness\bin\Release\net9.0\E0PinnedHarness.dll'
          foreach ($scenario in @('teammate', 'draw_energy')) {
            $baselineDir = Join-Path $env:RUNNER_TEMP "p4-ab-$scenario-baseline"
            $candidateDir = Join-Path $env:RUNNER_TEMP "p4-ab-$scenario-candidate"
            New-Item -ItemType Directory -Force -Path $baselineDir,$candidateDir | Out-Null

            $baselineLines = @(& dotnet $harness --scenario $scenario --out $baselineDir --p4-profile --p4-legacy-history-scan --max-nodes 2000 --budget-ms 15000 2>&1)
            $baselineExit = $LASTEXITCODE
            $baselineLines | ForEach-Object { Write-Host $_ }
            if ($baselineExit -ne 0) { throw "P4 baseline failed for $scenario." }

            $candidateLines = @(& dotnet $harness --scenario $scenario --out $candidateDir --p4-profile --max-nodes 2000 --budget-ms 15000 2>&1)
            $candidateExit = $LASTEXITCODE
            $candidateLines | ForEach-Object { Write-Host $_ }
            if ($candidateExit -ne 0) { throw "P4 candidate failed for $scenario." }

            $baseline = Get-Content -LiteralPath (Join-Path $baselineDir "e0-$scenario.json") -Raw | ConvertFrom-Json
            $candidate = Get-Content -LiteralPath (Join-Path $candidateDir "e0-$scenario.json") -Raw | ConvertFrom-Json

            $sameRoute = (@($baseline.route) -join [char]31) -eq (@($candidate.route) -join [char]31)
            $sameQuality = $baseline.projectedBattleHpLost -eq $candidate.projectedBattleHpLost -and
              $baseline.projectedBattlePotionCount -eq $candidate.projectedBattlePotionCount -and
              $baseline.combatEndedTurn -eq $candidate.combatEndedTurn -and
              $baseline.boundaryReason -eq $candidate.boundaryReason
            $sameWork = $baseline.totalExpandedNodes -eq $candidate.totalExpandedNodes -and
              $baseline.totalTransitionCount -eq $candidate.totalTransitionCount

            $baselineCombat = @($baseline.performance | Where-Object name -eq 'combat_fingerprint')[0]
            $candidateCombat = @($candidate.performance | Where-Object name -eq 'combat_fingerprint')[0]

            $baselineDetailLine = @($baselineLines | Where-Object { "$_" -like 'P4_FINGERPRINT_DETAIL*' })[-1]
            $candidateDetailLine = @($candidateLines | Where-Object { "$_" -like 'P4_FINGERPRINT_DETAIL*' })[-1]
            if ($null -eq $baselineDetailLine -or $null -eq $candidateDetailLine) {
              throw "P4 fingerprint detail missing for $scenario."
            }
            $baselineDetail = ("$baselineDetailLine" -split ' data=',2)[1] | ConvertFrom-Json
            $candidateDetail = ("$candidateDetailLine" -split ' data=',2)[1] | ConvertFrom-Json
            $baselineTurn = @($baselineDetail | Where-Object phase -eq 'TurnState')[0]
            $candidateTurn = @($candidateDetail | Where-Object phase -eq 'TurnState')[0]

            "P4_HISTORY_AB scenario=$scenario same_route=$sameRoute same_quality=$sameQuality same_work=$sameWork baseline_nodes=$($baseline.totalExpandedNodes) candidate_nodes=$($candidate.totalExpandedNodes) baseline_turn_ms=$($baselineTurn.elapsedMs) candidate_turn_ms=$($candidateTurn.elapsedMs) baseline_turn_alloc=$($baselineTurn.allocatedBytes) candidate_turn_alloc=$($candidateTurn.allocatedBytes) baseline_combat_ms=$($baselineCombat.elapsedMs) candidate_combat_ms=$($candidateCombat.elapsedMs) baseline_combat_alloc=$($baselineCombat.allocatedBytes) candidate_combat_alloc=$($candidateCombat.allocatedBytes)"

            if (-not $sameRoute -or -not $sameQuality -or -not $sameWork) {
              throw "P4 calculated-history fast path changed route/quality/work for $scenario."
            }
            if ($candidateTurn.allocatedBytes -ge $baselineTurn.allocatedBytes) {
              throw "P4 calculated-history fast path did not reduce TurnState allocations for $scenario."
            }
          }

      - name: P4 local potion fingerprint fresh-process A/B
        shell: pwsh
        run: |
          $harness = '.\source\tools\E0PinnedHarness\bin\Release\net9.0\E0PinnedHarness.dll'
          foreach ($scenario in @('teammate', 'draw_energy')) {
            $baselineDir = Join-Path $env:RUNNER_TEMP "p4-potion-$scenario-baseline"
            $candidateDir = Join-Path $env:RUNNER_TEMP "p4-potion-$scenario-candidate"
            New-Item -ItemType Directory -Force -Path $baselineDir,$candidateDir | Out-Null

            $baselineLines = @(& dotnet $harness --scenario $scenario --out $baselineDir --p4-profile --p4-legacy-potion-sort --max-nodes 2000 --budget-ms 15000 2>&1)
            $baselineExit = $LASTEXITCODE
            $baselineLines | ForEach-Object { Write-Host $_ }
            if ($baselineExit -ne 0) { throw "P4 potion baseline failed for $scenario." }

            $candidateLines = @(& dotnet $harness --scenario $scenario --out $candidateDir --p4-profile --max-nodes 2000 --budget-ms 15000 2>&1)
            $candidateExit = $LASTEXITCODE
            $candidateLines | ForEach-Object { Write-Host $_ }
            if ($candidateExit -ne 0) { throw "P4 potion candidate failed for $scenario." }

            $baseline = Get-Content -LiteralPath (Join-Path $baselineDir "e0-$scenario.json") -Raw | ConvertFrom-Json
            $candidate = Get-Content -LiteralPath (Join-Path $candidateDir "e0-$scenario.json") -Raw | ConvertFrom-Json
            $sameRoute = (@($baseline.route) -join [char]31) -eq (@($candidate.route) -join [char]31)
            $sameQuality = $baseline.projectedBattleHpLost -eq $candidate.projectedBattleHpLost -and
              $baseline.projectedBattlePotionCount -eq $candidate.projectedBattlePotionCount -and
              $baseline.combatEndedTurn -eq $candidate.combatEndedTurn -and
              $baseline.boundaryReason -eq $candidate.boundaryReason
            $sameWork = $baseline.totalExpandedNodes -eq $candidate.totalExpandedNodes -and
              $baseline.totalTransitionCount -eq $candidate.totalTransitionCount

            $baselineDetailLine = @($baselineLines | Where-Object { "$_" -like 'P4_FINGERPRINT_DETAIL*' })[-1]
            $candidateDetailLine = @($candidateLines | Where-Object { "$_" -like 'P4_FINGERPRINT_DETAIL*' })[-1]
            $baselineDetail = ("$baselineDetailLine" -split ' data=',2)[1] | ConvertFrom-Json
            $candidateDetail = ("$candidateDetailLine" -split ' data=',2)[1] | ConvertFrom-Json
            $baselinePhase = @($baselineDetail | Where-Object phase -eq 'RelicPotion')[0]
            $candidatePhase = @($candidateDetail | Where-Object phase -eq 'RelicPotion')[0]

            "P4_POTION_AB scenario=$scenario same_route=$sameRoute same_quality=$sameQuality same_work=$sameWork baseline_nodes=$($baseline.totalExpandedNodes) candidate_nodes=$($candidate.totalExpandedNodes) baseline_ms=$($baselinePhase.elapsedMs) candidate_ms=$($candidatePhase.elapsedMs) baseline_alloc=$($baselinePhase.allocatedBytes) candidate_alloc=$($candidatePhase.allocatedBytes)"

            if (-not $sameRoute -or -not $sameQuality -or -not $sameWork) {
              throw "P4 potion fingerprint fast path changed route/quality/work for $scenario."
            }
            if ($scenario -eq 'teammate' -and $candidatePhase.allocatedBytes -ge $baselinePhase.allocatedBytes) {
              throw "P4 local multiplayer potion fingerprint fast path did not reduce allocations."
            }
          }


      - name: P4 snapshot LINQ fresh-process A/B
        shell: pwsh
        run: |
          $harness = '.\source\tools\E0PinnedHarness\bin\Release\net9.0\E0PinnedHarness.dll'
          foreach ($scenario in @('teammate', 'draw_energy')) {
            $baselineDir = Join-Path $env:RUNNER_TEMP "p4-snapshot-$scenario-baseline"
            $candidateDir = Join-Path $env:RUNNER_TEMP "p4-snapshot-$scenario-candidate"
            New-Item -ItemType Directory -Force -Path $baselineDir,$candidateDir | Out-Null

            & dotnet $harness --scenario $scenario --out $baselineDir --p4-profile --p4-legacy-snapshot-linq --max-nodes 2000 --budget-ms 15000
            if ($LASTEXITCODE -ne 0) { throw "P4 snapshot baseline failed for $scenario." }
            & dotnet $harness --scenario $scenario --out $candidateDir --p4-profile --max-nodes 2000 --budget-ms 15000
            if ($LASTEXITCODE -ne 0) { throw "P4 snapshot candidate failed for $scenario." }

            $baseline = Get-Content -LiteralPath (Join-Path $baselineDir "e0-$scenario.json") -Raw | ConvertFrom-Json
            $candidate = Get-Content -LiteralPath (Join-Path $candidateDir "e0-$scenario.json") -Raw | ConvertFrom-Json
            $sameRoute = (@($baseline.route) -join [char]31) -eq (@($candidate.route) -join [char]31)
            $sameQuality = $baseline.projectedBattleHpLost -eq $candidate.projectedBattleHpLost -and
              $baseline.projectedBattlePotionCount -eq $candidate.projectedBattlePotionCount -and
              $baseline.combatEndedTurn -eq $candidate.combatEndedTurn -and
              $baseline.boundaryReason -eq $candidate.boundaryReason
            $sameWork = $baseline.totalExpandedNodes -eq $candidate.totalExpandedNodes -and
              $baseline.totalTransitionCount -eq $candidate.totalTransitionCount
            $baselineSnapshot = @($baseline.performance | Where-Object name -eq 'snapshot')[0]
            $candidateSnapshot = @($candidate.performance | Where-Object name -eq 'snapshot')[0]

            "P4_SNAPSHOT_AB scenario=$scenario same_route=$sameRoute same_quality=$sameQuality same_work=$sameWork baseline_nodes=$($baseline.totalExpandedNodes) candidate_nodes=$($candidate.totalExpandedNodes) baseline_ms=$($baselineSnapshot.elapsedMs) candidate_ms=$($candidateSnapshot.elapsedMs) baseline_alloc=$($baselineSnapshot.allocatedBytes) candidate_alloc=$($candidateSnapshot.allocatedBytes)"

            if (-not $sameRoute -or -not $sameQuality -or -not $sameWork) {
              throw "P4 snapshot no-LINQ path changed route/quality/work for $scenario."
            }
            if ($candidateSnapshot.allocatedBytes -ge $baselineSnapshot.allocatedBytes) {
              throw "P4 snapshot no-LINQ path did not reduce allocations for $scenario."
            }
          }
