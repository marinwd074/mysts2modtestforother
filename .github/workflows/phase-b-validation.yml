name: Phase B deferred-impact validation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/phase-b-validation.yml'
      - 'source/src/Search/CombatPlan.cs'
      - 'source/src/Search/CombatBeamSolver.Terminal.cs'
      - 'source/src/Search/CombatBeamSolver.BlockPotionInsertion.cs'
      - 'source/src/Search/CombatBeamSolver.Phases.cs'
      - 'source/tools/U0U1PinnedHarness/**'

permissions:
  contents: read

concurrency:
  group: phase-b-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-b:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          lfs: false

      - name: Fetch pinned 0.107.1 game references
        shell: pwsh
        run: |
          git lfs pull --include="game-body/data_sts2_windows_x86_64/sts2.dll,game-body/data_sts2_windows_x86_64/0Harmony.dll,game-body/data_sts2_windows_x86_64/GodotSharp.dll,game-body/data_sts2_windows_x86_64/Steamworks.NET.dll,game-body/data_sts2_windows_x86_64/System.IO.Hashing.dll,game-body/data_sts2_windows_x86_64/SmartFormat.dll,game-body/data_sts2_windows_x86_64/SmartFormat.ZString.dll,game-body/data_sts2_windows_x86_64/JetBrains.Annotations.dll,game-body/data_sts2_windows_x86_64/Sentry.dll" --exclude=""
          $dll = '.\game-body\data_sts2_windows_x86_64\sts2.dll'
          $actual = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'a1f9e653f1e28e4076558fee1e60d218619cb7e057b887c6417f62c62c6d7a52'
          if ($actual -ne $expected) {
            throw "Pinned sts2.dll hash mismatch. expected=$expected actual=$actual"
          }

      - name: Fetch pinned RitsuLib
        shell: pwsh
        run: |
          $uri = 'https://github.com/BAKAOLC/STS2-RitsuLib/releases/download/v0.6.2/STS2.RitsuLib.Compat.0.107.1.0.6.2.github.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'ritsulib-0.107.1-0.6.2.zip'
          Invoke-WebRequest -Uri $uri -OutFile $zip
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '8cb0bc276d3c64dde5ea5415e1738808dcbe71f0a0baf3ef51008ae6dde13517'
          if ($actual -ne $expected) {
            throw "RitsuLib package hash mismatch. expected=$expected actual=$actual"
          }
          $out = Join-Path $env:RUNNER_TEMP 'ritsulib'
          Expand-Archive -LiteralPath $zip -DestinationPath $out -Force
          $props = Get-ChildItem -LiteralPath $out -Recurse -Filter 'RitsuLib.References.props' | Select-Object -First 1
          if ($null -eq $props) {
            throw 'RitsuLib.References.props not found in pinned compatibility package.'
          }
          "RITSU_PROPS=$($props.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RITSU_ROOT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build CombatSolver Release
        shell: pwsh
        run: |
          $gameData = (Resolve-Path '.\game-body\data_sts2_windows_x86_64').Path
          dotnet build '.\source\CombatSolver.csproj' -c Release -p:CopyModOnBuild=false -p:Sts2DataDir="$gameData" -p:RitsuLibReferencesProps="$env:RITSU_PROPS" -p:RitsuLibReferenceTarget='0.107.1' -p:TreatWarningsAsErrors=true --nologo

      - name: Build pinned replay harness
        shell: pwsh
        run: |
          $gameData = (Resolve-Path '.\game-body\data_sts2_windows_x86_64').Path
          dotnet build '.\source\tools\U0U1PinnedHarness\U0U1PinnedHarness.csproj' -c Release -p:Sts2DataDir="$gameData" -p:RitsuLibReferencesProps="$env:RITSU_PROPS" -p:RitsuWorkshopRoot="$env:RITSU_ROOT" -p:RitsuLibReferenceTarget='0.107.1' -p:TreatWarningsAsErrors=true --nologo

      - name: Run deferred-impact pinned contract
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP 'phase-b-pinned'
          & dotnet '.\source\tools\U0U1PinnedHarness\bin\Release\net9.0\U0U1PinnedHarness.dll' --out $workspace
          if ($LASTEXITCODE -ne 0) {
            throw "U0/U1 pinned harness failed with exit $LASTEXITCODE."
          }
          $evidencePath = Join-Path $workspace 'u0-u1-pinned-evidence.json'
          if (-not (Test-Path -LiteralPath $evidencePath)) {
            throw 'Pinned harness produced no evidence.'
          }
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ($null -eq $evidence.phaseB -or $evidence.phaseB.Status -ne 'PASS') {
            throw 'Phase B deferred-impact evidence did not pass.'
          }
          $evidence.phaseB | ConvertTo-Json -Depth 8
