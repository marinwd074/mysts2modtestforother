name: P3 scheduling measurement

on:
  push:
    branches:
      - p3-validation
    paths:
      - '.github/workflows/p3-scheduling-measurement.yml'
      - 'source/**'

permissions:
  contents: read

jobs:
  p3-measure:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          lfs: false

      - name: Fetch pinned 0.107.1 game references
        shell: pwsh
        run: |
          git lfs pull --include="game-body/data_sts2_windows_x86_64/sts2.dll,game-body/data_sts2_windows_x86_64/0Harmony.dll,game-body/data_sts2_windows_x86_64/GodotSharp.dll,game-body/data_sts2_windows_x86_64/Steamworks.NET.dll,game-body/data_sts2_windows_x86_64/System.IO.Hashing.dll,game-body/data_sts2_windows_x86_64/SmartFormat.dll,game-body/data_sts2_windows_x86_64/SmartFormat.ZString.dll,game-body/data_sts2_windows_x86_64/JetBrains.Annotations.dll,game-body/data_sts2_windows_x86_64/Sentry.dll" --exclude=""
          $dll = '.\game-body\data_sts2_windows_x86_64\sts2.dll'
          $actual = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'a1f9e653f1e28e4076558fee1e60d218619cb7e057b887c6417f62c62c6d7a52'
          if ($actual -ne $expected) {
            throw "Pinned sts2.dll hash mismatch. expected=$expected actual=$actual"
          }

      - name: Fetch pinned RitsuLib 0.107.1 compatibility package
        shell: pwsh
        run: |
          $uri = 'https://github.com/BAKAOLC/STS2-RitsuLib/releases/download/v0.6.2/STS2.RitsuLib.Compat.0.107.1.0.6.2.github.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'ritsulib-0.107.1-0.6.2.zip'
          Invoke-WebRequest -Uri $uri -OutFile $zip
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '8cb0bc276d3c64dde5ea5415e1738808dcbe71f0a0baf3ef51008ae6dde13517'
          if ($actual -ne $expected) {
            throw "RitsuLib package hash mismatch. expected=$expected actual=$actual"
          }
          $out = Join-Path $env:RUNNER_TEMP 'ritsulib'
          Expand-Archive -LiteralPath $zip -DestinationPath $out -Force
          $props = Get-ChildItem -LiteralPath $out -Recurse -Filter 'RitsuLib.References.props' | Select-Object -First 1
          if ($null -eq $props) {
            throw 'RitsuLib.References.props not found in pinned compatibility package.'
          }
          "RITSU_PROPS=$($props.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RITSU_ROOT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Release build
        shell: pwsh
        run: |
          $gameData = (Resolve-Path '.\game-body\data_sts2_windows_x86_64').Path
          dotnet build '.\source\CombatSolver.csproj' -c Release -p:CopyModOnBuild=false -p:Sts2DataDir="$gameData" -p:RitsuLibReferencesProps="$env:RITSU_PROPS" -p:RitsuLibReferenceTarget='0.107.1' -p:TreatWarningsAsErrors=true --nologo

      - name: Build P3 E0 probe
        shell: pwsh
        run: |
          $gameData = (Resolve-Path '.\game-body\data_sts2_windows_x86_64').Path
          dotnet build '.\source\tools\E0PinnedHarness\E0PinnedHarness.csproj' -c Release -p:Sts2DataDir="$gameData" -p:RitsuLibReferencesProps="$env:RITSU_PROPS" -p:RitsuWorkshopRoot="$env:RITSU_ROOT" -p:RitsuLibReferenceTarget='0.107.1' -p:TreatWarningsAsErrors=true --nologo

      - name: Run P3 fresh-process cold and warm pairs
        shell: pwsh
        run: |
          $harness = '.\source\tools\E0PinnedHarness\bin\Release\net9.0\E0PinnedHarness.dll'
          $cases = @(
            @{ Name = 'cold-baseline'; Mode = '--p3-single-baseline'; Prewarm = $false },
            @{ Name = 'cold-cross'; Mode = '--p3-single-cross'; Prewarm = $false },
            @{ Name = 'warm1-baseline'; Mode = '--p3-single-baseline'; Prewarm = $true },
            @{ Name = 'warm1-cross'; Mode = '--p3-single-cross'; Prewarm = $true },
            @{ Name = 'warm2-baseline'; Mode = '--p3-single-baseline'; Prewarm = $true },
            @{ Name = 'warm2-cross'; Mode = '--p3-single-cross'; Prewarm = $true }
          )

          foreach ($case in $cases) {
            $workspace = Join-Path $env:RUNNER_TEMP $case.Name
            New-Item -ItemType Directory -Force -Path $workspace | Out-Null
            $args = @(
              $harness,
              '--scenario', 'teammate',
              '--out', $workspace,
              '--p3-scheduling-probe',
              $case.Mode
            )
            if ($case.Prewarm) {
              $args += '--p3-prewarm'
            }
            & dotnet @args
            if ($LASTEXITCODE -ne 0) {
              throw "P3 single-run evidence failed for $($case.Name) with exit $LASTEXITCODE."
            }
            $evidence = Get-Content -LiteralPath (Join-Path $workspace 'p3-single.json') -Raw
            "P3_SINGLE_CASE=$($case.Name) $($evidence -replace '\r?\n',' ')"
          }

          $pairs = @(
            @{ Name = 'cold'; Baseline = 'cold-baseline'; Cross = 'cold-cross' },
            @{ Name = 'warm1'; Baseline = 'warm1-baseline'; Cross = 'warm1-cross' },
            @{ Name = 'warm2'; Baseline = 'warm2-baseline'; Cross = 'warm2-cross' }
          )
          $scheduledWarmPairs = 0
          $earlierWarmPairs = 0
          foreach ($pair in $pairs) {
            $baselineDir = Join-Path $env:RUNNER_TEMP $pair.Baseline
            $crossDir = Join-Path $env:RUNNER_TEMP $pair.Cross
            $baselineQuality = Join-Path $baselineDir 'p3-quality.json'
            $crossQuality = Join-Path $crossDir 'p3-quality.json'

            & dotnet $harness --p3-compare-candidate $crossQuality --p3-compare-current $baselineQuality
            if ($LASTEXITCODE -ne 0) {
              throw "P3 formal quality regression in $($pair.Name) pair."
            }

            $baseline = Get-Content -LiteralPath (Join-Path $baselineDir 'p3-single.json') -Raw | ConvertFrom-Json
            $cross = Get-Content -LiteralPath (Join-Path $crossDir 'p3-single.json') -Raw | ConvertFrom-Json

            if ($cross.TotalExpandedNodes -gt $cross.configuredMaxExpandedNodes) {
              throw "P3 $($pair.Name) exceeded node budget: $($cross.TotalExpandedNodes)>$($cross.configuredMaxExpandedNodes)."
            }
            if ($pair.Name -like 'warm*' -and $null -ne $cross.firstPotionWorkMs) {
              $scheduledWarmPairs++
              if ($null -eq $baseline.firstPotionWorkMs -or $cross.firstPotionWorkMs -lt $baseline.firstPotionWorkMs) {
                $earlierWarmPairs++
              } else {
                throw "P3 $($pair.Name) did not start potion work earlier than baseline."
              }
            }

            "P3_FRESH_PAIR name=$($pair.Name) baseline_hp=$($baseline.ProjectedBattleHpLost) cross_hp=$($cross.ProjectedBattleHpLost) baseline_potion_first_ms=$($baseline.firstPotionWorkMs) cross_potion_first_ms=$($cross.firstPotionWorkMs) baseline_nodes=$($baseline.TotalExpandedNodes) cross_nodes=$($cross.TotalExpandedNodes) baseline_published_ms=$($baseline.publishedMs) cross_published_ms=$($cross.publishedMs)"
          }

          if ($scheduledWarmPairs -lt 1 -or $earlierWarmPairs -ne $scheduledWarmPairs) {
            throw "P3 warm evidence did not demonstrate earlier potion work."
          }
          "P3_FRESH_SUMMARY pairs=3 searches=10 warm_potion_scheduled=$scheduledWarmPairs warm_potion_earlier=$earlierWarmPairs"
