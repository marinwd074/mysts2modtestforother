name: 0.107.1 compatibility consistency

on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'UPSTREAM.md'
      - 'AGENTS.md'
      - 'game-body/README.md'
      - 'source/**'
  pull_request:
    paths:
      - '.github/**'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'UPSTREAM.md'
      - 'AGENTS.md'
      - 'game-body/README.md'
      - 'source/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Fast compatibility gate
        shell: pwsh
        run: |
          ./source/tools/verify-target-version.ps1
          ./source/tools/verify-refactor-boundaries.ps1
          ./source/tools/verify-repository-hygiene.ps1

          [xml]$project = Get-Content -LiteralPath './source/CombatSolver.csproj' -Raw
          if ($project.Project.Sdk -ne 'Godot.NET.Sdk/4.5.1') {
            throw 'CombatSolver.csproj SDK drifted from the pinned Godot SDK.'
          }

          $target = Get-Content -LiteralPath './source/build-target.json' -Raw | ConvertFrom-Json
          if ($target.game_version -ne '0.107.1' -or
              $target.ritsu_lib_target_version -ne '0.107.1' -or
              $target.compatibility_symbol -ne 'STS2_01071') {
            throw 'build-target.json does not describe the supported 0.107.1 target.'
          }

# Default push/PR CI stays tiny: one Linux structural/version/documentation gate.
# Heavy pinned builds, runtime replays, monster IL audits, and full contracts are
# manual workflows. Tag releases still perform their own pinned Release build.
