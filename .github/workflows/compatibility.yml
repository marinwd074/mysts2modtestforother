name: 0.107.1 compatibility consistency

on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - 'source/**'
      - '!source/docs/**'
  pull_request:
    paths:
      - '.github/**'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
      - 'source/**'
      - '!source/docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Fast compatibility gate
        shell: pwsh
        run: |
          ./source/tools/verify-target-version.ps1
          ./source/tools/verify-refactor-boundaries.ps1

  contract-tests:
    # Keep the historical check name so existing required-check settings do not
    # become pending forever. The expensive contract suite is manual below.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Minimal source sanity
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath './source/CombatSolver.csproj' -Raw
          if ($project.Project.Sdk -ne 'Godot.NET.Sdk/4.5.1') {
            throw 'CombatSolver.csproj SDK drifted from the pinned Godot SDK.'
          }
          $target = Get-Content -LiteralPath './source/build-target.json' -Raw | ConvertFrom-Json
          if ($target.game_version -ne '0.107.1' -or
              $target.ritsu_lib_target_version -ne '0.107.1' -or
              $target.compatibility_symbol -ne 'STS2_01071') {
            throw 'build-target.json does not describe the supported 0.107.1 target.'
          }

  full-contract-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Run full L1 contract suite
        shell: pwsh
        run: ./source/tools/run-contract-tests.ps1

# Default push/PR CI is intentionally a very small structural gate. Full L1
# contracts remain available on demand through workflow_dispatch. Native game
# Release/runtime evidence remains local because it requires STS2/RitsuLib.
