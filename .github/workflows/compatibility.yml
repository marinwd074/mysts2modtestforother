name: 0.107.1 compatibility consistency

on:
  push:
    paths:
      - '.github/workflows/compatibility.yml'
      - 'source/**'
      - '!source/docs/**'
  pull_request:
    paths:
      - '.github/workflows/compatibility.yml'
      - 'source/**'
      - '!source/docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-consistency:
    # This job only parses source/XML and runs PowerShell 7; keep it off the
    # Windows pool so a Windows-hosted allocation problem cannot hide static drift.
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify target version guard
        shell: pwsh
        run: ./source/tools/verify-target-version.ps1

      - name: Verify architecture boundaries
        shell: pwsh
        run: ./source/tools/verify-refactor-boundaries.ps1

      - name: Validate target manifest and project XML
        shell: pwsh
        run: |
          $target = Get-Content -LiteralPath './source/build-target.json' -Raw | ConvertFrom-Json
          if ($target.game_version -ne '0.107.1' -or
              $target.ritsu_lib_target_version -ne '0.107.1' -or
              $target.compatibility_symbol -ne 'STS2_01071') {
            throw 'build-target.json does not describe the supported 0.107.1 target.'
          }
          [xml]$project = Get-Content -LiteralPath './source/CombatSolver.csproj' -Raw
          if ($project.Project.Sdk -ne 'Godot.NET.Sdk/4.5.1') {
            throw 'CombatSolver.csproj SDK drifted from the pinned Godot SDK.'
          }
          git diff --check

  contract-tests:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run L1 pure contract tests
        shell: pwsh
        run: ./source/tools/run-contract-tests.ps1

# The full game build and headless smoke require the locally installed STS2 and
# RitsuLib payloads. This workflow intentionally gates only source consistency;
# local Release/runtime evidence remains the authoritative integration check.